<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Serverless Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>☁️ Serverless Task Manager</h1>
            <p>Manage your tasks with a cloud-powered application</p>
        </header>

        <section class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button onclick="addTask()">
                Add Task
            </button>

        </section>

        <section class="stats">

            <div class="stat-card">
                <h3>Total Tasks</h3>
                <p id="totalTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Completed</h3>
                <p id="completedTasks">0</p>
            </div>

            <div class="stat-card">
                <h3>Pending</h3>
                <p id="pendingTasks">0</p>
            </div>

        </section>

        <section class="tasks-section">

            <h2>My Tasks</h2>

            <div id="taskList">

                <div class="empty">
                    No tasks available
                </div>

            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
